# Deploy the static site already committed at the repository root.
# Direct Pages API enablement returned 403 for this token, so this workflow
# asks configure-pages to enable a GitHub Actions source. If that is refused,
# the owner must set Settings > Pages > Source to "GitHub Actions".
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # The cloud-agent token cannot create the Pages site (API 403).
          # This lets the workflow token enable Pages with a GitHub Actions source.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
